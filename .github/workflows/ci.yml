name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

env:
  TERRAFORM_VERSION: 1.9.8

jobs:
  app:
    name: Test, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vitest's worker pool needs real Node, and jsdom needs ^24.15.0 on this line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build

  terraform:
    name: Terraform checks (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [staging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir="infra/terraform/environments/$ENVIRONMENT" init -backend=false -input=false -lockfile=readonly
        env:
          ENVIRONMENT: ${{ matrix.environment }}
      - run: terraform -chdir="infra/terraform/environments/$ENVIRONMENT" validate
        env:
          ENVIRONMENT: ${{ matrix.environment }}

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Playwright and the Auth emulator run on real Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run e2e:check
      - run: bun x playwright install --with-deps "$BROWSER"
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
      - run: bun run e2e --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      # Holds only emulator data and throwaway example.test accounts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # To add production, copy this job with its own inputs and `needs: deploy-staging`.
  deploy-staging:
    name: Deploy staging
    needs: [app, terraform, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dipasqualew/disnostos'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    # Lets the called job read the secrets of its GitHub environment.
    secrets: inherit
    with:
      environment: staging
      terraform_version: 1.9.8 # Keep in step with TERRAFORM_VERSION above.
